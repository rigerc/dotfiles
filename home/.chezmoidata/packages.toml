[packages.pacman]
core = ["git", "chezmoi", "fish", "atuin", "github-cli", "openssh", "curl"]
desktop = [
  "ghostty", "hyprland", "noctalia",
  "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk",
  "pipewire", "pipewire-pulse", "wireplumber",
  "wl-clipboard", "brightnessctl", "grim", "slurp",
]
developer = ["jq", "ripgrep", "fd", "fzf", "neovim", "tmux"]

# Chromebook official packages: desktop/developer profiles only, no AUR.
chromebook = [
  "foot", "mesa", "libva-utils", "upower", "wev",
  "alsa-utils", "alsa-ucm-conf", "sof-firmware", "pipewire-alsa",
  "xorg-xwayland", "networkmanager", "bluez", "bluez-utils",
  "ttf-jetbrains-mono-nerd", "noto-fonts", "noto-fonts-emoji",
  "zram-generator",
]
